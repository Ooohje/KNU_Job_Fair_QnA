<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QR 접속 안내 · 강연 Q&amp;A</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="qr-page">
  <div class="qr-layout">
    <div class="qr-box" id="qr-box">
      <!-- QR 이 그려지기 전 자리 표시 -->
      <svg viewBox="0 0 100 100" role="img" aria-label="QR 코드">
        <rect width="100" height="100" fill="#fff"></rect>
        <g fill="none" stroke="#c9ced6" stroke-width="5"><rect x="4.5" y="4.5" width="23" height="23" rx="2"></rect><rect x="72.5" y="4.5" width="23" height="23" rx="2"></rect><rect x="4.5" y="72.5" width="23" height="23" rx="2"></rect></g>
      </svg>
    </div>

    <div class="qr-copy">
      <p class="qr-kicker" id="kicker">경북대학교 잡페어 · 강연 Q&amp;A</p>
      <h1 class="qr-title">휴대폰으로<br>익명 질문하세요</h1>
      <p class="qr-url" id="url-text">…</p>
      <p id="qr-fallback" hidden style="margin-top: 2vmin; font-size: clamp(14px, 2.2vmin, 28px); color: var(--color-danger)">QR 생성에 실패했습니다. 위 주소를 직접 입력해 주세요.</p>
      <ul class="qr-points">
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          로그인 없음
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          이름 없음
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          언제든 질문 가능
        </li>
      </ul>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.QNA_CONFIG || {};

  // 접속 주소: config.js 의 PUBLIC_URL, 없으면 이 페이지와 같은 폴더의 index.html
  var target = cfg.PUBLIC_URL || new URL('index.html', location.href).href;

  document.getElementById('url-text').textContent =
    target.replace(/^https?:\/\//, '').replace(/\/$/, '');

  if (cfg.TALK_TITLE) {
    document.getElementById('kicker').textContent = cfg.TALK_TITLE;
    document.title = 'QR 접속 안내 · ' + cfg.TALK_TITLE;
  }

  function fail() {
    document.getElementById('qr-fallback').hidden = false;
  }

  function draw() {
    if (!window.QRCode) { fail(); return; }

    // qrcodejs 는 넘겨준 요소 안에 canvas 를 그린다.
    // 그걸 그대로 두면 .qr-box 의 크기 규칙(img/svg)이 안 먹으므로 img 로 옮긴다.
    var holder = document.createElement('div');
    try {
      new QRCode(holder, {
        text: target,
        width: 1000,
        height: 1000,
        colorDark: '#15171c',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    } catch (e) {
      fail();
      return;
    }

    setTimeout(function () {
      var canvas = holder.querySelector('canvas');
      var made = holder.querySelector('img');
      var src = canvas ? canvas.toDataURL('image/png') : (made && made.src);
      if (!src) { fail(); return; }

      var img = new Image();
      img.src = src;
      img.alt = 'QR 코드: ' + target;
      var box = document.getElementById('qr-box');
      box.textContent = '';
      box.appendChild(img);
    }, 60);
  }

  // 스크립트가 늦게 로드되는 경우까지 대비
  if (window.QRCode) draw();
  else window.addEventListener('load', draw);
})();
</script>
</body>
</html>
